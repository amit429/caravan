<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Caravan — v1 screens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Inter+Tight:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* surfaces */
  --paper:#EDEAE3; --card:#FFFFFF; --sunk:#E4E0D6; --line:#D8D3C7;
  /* ink */
  --ink:#17181C; --ink2:#5A5C63; --ink3:#9A9CA3;
  /* identity */
  --plum:#5D2A5B; --plum-d:#46203F; --plum-t:#EFE2EE;
  --signal:#CBE83A; --signal-d:#8FA81C;
  --agent:#1B7A6B; --agent-t:#DCEFEB;
  --warn:#C98A06; --warn-t:#F7ECD2;
  --stop:#B93333; --stop-t:#F6DEDE;
  /* member colours */
  --m1:#5D2A5B; --m2:#1B7A6B; --m3:#2F5AA8; --m4:#B06A1C; --m5:#9C2B54; --m6:#4A6B22;
  --r-sm:8px; --r:12px; --r-lg:18px; --r-xl:26px;
  --f-disp:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-ui:"Inter Tight",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--f-ui);background:#22232A;color:var(--ink);display:flex;min-height:100vh}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- shell ---------- */
aside{position:sticky;top:0;height:100vh;width:250px;flex:none;background:#1A1B21;color:#D6D7DC;padding:26px 20px;overflow-y:auto;border-right:1px solid #2E3038}
aside h1{font-family:var(--f-disp);font-size:19px;font-weight:700;color:#fff;letter-spacing:-.01em}
aside .sub{font-size:12px;color:#84868F;margin-top:5px;line-height:1.5}
aside .flow{margin-top:22px}
aside .flow > p{font-family:var(--f-mono);font-size:10.5px;color:#6E707A;margin-bottom:7px}
aside a{display:block;color:#B9BAC2;text-decoration:none;font-size:12.5px;padding:4px 8px;border-radius:6px;line-height:1.45}
aside a:hover{background:#2A2C34;color:#fff}
main{flex:1;padding:36px 40px 90px}
main > header{margin-bottom:32px;max-width:640px}
main > header h2{font-family:var(--f-disp);font-size:30px;font-weight:700;color:#fff;letter-spacing:-.02em}
main > header p{color:#9A9CA6;font-size:14px;margin-top:10px;line-height:1.6}
.flowhead{font-family:var(--f-disp);font-size:16px;font-weight:600;color:#fff;margin:44px 0 4px;padding-top:22px;border-top:1px solid #32343C}
.flowhead:first-of-type{border-top:0;padding-top:0;margin-top:8px}
.flowdesc{color:#83858F;font-size:12.5px;margin-bottom:22px;max-width:620px;line-height:1.6}
.grid{display:flex;flex-wrap:wrap;gap:34px}
.slot{width:390px}
.slot > .cap{color:#9EA0AA;font-size:12px;margin-bottom:9px;display:flex;gap:8px;align-items:baseline}
.slot > .cap b{color:#fff;font-weight:500;font-size:12.5px}
.slot > .cap i{font-family:var(--f-mono);font-style:normal;color:#65676F;font-size:10.5px}

/* ---------- device ---------- */
.phone{width:390px;height:844px;background:var(--paper);border-radius:34px;overflow:hidden;
  display:flex;flex-direction:column;position:relative;font-size:15px;line-height:1.45;color:var(--ink);
  box-shadow:0 18px 44px rgba(0,0,0,.42)}
.phone *{font-size:inherit}
.scroll{flex:1;overflow:hidden;display:flex;flex-direction:column}

/* ---------- chrome ---------- */
.sb{display:flex;align-items:center;padding:13px 24px 6px;flex:none}
.sb .t{font-weight:600;font-size:13px}
.sb .r{margin-left:auto;font-size:11px;color:var(--ink2);font-family:var(--f-mono)}
.appbar{display:flex;align-items:center;gap:11px;padding:4px 20px 13px;flex:none}
.appbar .bk{font-size:21px;color:var(--ink);line-height:1;margin-top:-3px}
.appbar h3{font-family:var(--f-disp);font-size:17px;font-weight:600;letter-spacing:-.01em}
.appbar .rt{margin-left:auto;font-size:12px;color:var(--ink2)}
.body{flex:1;padding:0 20px 22px;display:flex;flex-direction:column;gap:16px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.body.tight{gap:11px}
.body.flush{padding-left:0;padding-right:0}
.push{flex:1}

/* tab bar */
.tabbar{flex:none;display:flex;border-top:1px solid var(--line);background:var(--card);padding:9px 8px 22px}
.tabbar div{flex:1;text-align:center;font-size:11px;color:var(--ink3);display:flex;flex-direction:column;gap:5px;align-items:center;position:relative}
.tabbar .ic{width:21px;height:21px;border-radius:6px;background:var(--ink3);opacity:.5}
.tabbar .on{color:var(--plum);font-weight:600}
.tabbar .on .ic{background:var(--plum);opacity:1}
.tabbar .bdg{position:absolute;top:-3px;right:50%;margin-right:-19px;background:var(--stop);color:#fff;
  font-size:9px;font-weight:600;min-width:15px;height:15px;border-radius:99px;display:grid;place-items:center;padding:0 4px}

/* ---------- type ---------- */
.d1{font-family:var(--f-disp);font-size:29px;font-weight:700;letter-spacing:-.03em;line-height:1.12}
.h1{font-family:var(--f-disp);font-size:23px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.h2{font-family:var(--f-disp);font-size:17px;font-weight:600;letter-spacing:-.01em}
.h3{font-size:14px;font-weight:600}
.p{font-size:14.5px;color:var(--ink2);line-height:1.55}
.sm{font-size:12.5px;color:var(--ink2);line-height:1.5}
.xs{font-size:11.5px;color:var(--ink3);line-height:1.45}
.mono{font-family:var(--f-mono)}
.strong{color:var(--ink);font-weight:500}

/* ---------- atoms ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;padding:15px 18px;border-radius:var(--r);
  font-size:15px;font-weight:600;border:0;width:100%;font-family:var(--f-ui);cursor:default}
.btn-p{background:var(--plum);color:#fff}
.btn-s{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn-g{background:transparent;color:var(--ink2);font-weight:500}
.btn-sig{background:var(--signal);color:#25290D}
.btn.sm{padding:10px 14px;font-size:13px;width:auto}
.row{display:flex;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.wrap{display:flex;flex-wrap:wrap;gap:7px}
.card{background:var(--card);border-radius:var(--r-lg);padding:16px}
.card.flat{background:var(--sunk)}
.card.line{background:transparent;border:1px solid var(--line)}
.chip{padding:8px 13px;border-radius:99px;font-size:13px;background:var(--card);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper);font-weight:500}
.chip.sig{background:var(--signal);border-color:var(--signal);color:#25290D;font-weight:600}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:10.5px;font-weight:600;font-family:var(--f-mono)}
.pill.plum{background:var(--plum-t);color:var(--plum)}
.pill.agent{background:var(--agent-t);color:var(--agent)}
.pill.warn{background:var(--warn-t);color:var(--warn)}
.pill.ok{background:var(--signal);color:#3B4410}
.pill.stop{background:var(--stop-t);color:var(--stop)}
.pill.grey{background:var(--sunk);color:var(--ink2)}
.av{width:32px;height:32px;border-radius:99px;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:600;flex:none}
.av.sm{width:24px;height:24px;font-size:9.5px}
.av.lg{width:46px;height:46px;font-size:16px}
.stackav{display:flex}
.stackav .av{margin-left:-9px;border:2px solid var(--paper)}
.stackav .av:first-child{margin-left:0}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;font-weight:500;color:var(--ink2)}
.input{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;font-size:15px}
.input.ph{color:var(--ink3)}
.rule{height:1px;background:var(--line)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:6px;height:6px;border-radius:99px;background:var(--line);display:block}
.dots i.on{width:22px;background:var(--plum)}
.sheet{margin-top:auto;background:var(--card);border-radius:var(--r-xl) var(--r-xl) 0 0;padding:10px 20px 26px;
  display:flex;flex-direction:column;gap:15px;box-shadow:0 -8px 30px rgba(23,24,28,.12)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:0 auto 6px}
.scrim{position:absolute;inset:0;background:rgba(23,24,28,.4)}
.ovl{position:absolute;inset:0;display:flex;flex-direction:column}
.body::-webkit-scrollbar,.feed::-webkit-scrollbar{width:4px}
.body::-webkit-scrollbar-thumb,.feed::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
</style>
</head>
<body>
<style>
/* ---------- room / feed ---------- */
.feed{flex:1;padding:2px 16px 12px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.daysep{display:flex;align-items:center;gap:10px;color:var(--ink3);font-size:10.5px;font-family:var(--f-mono)}
.daysep::before,.daysep::after{content:"";flex:1;height:1px;background:var(--line)}
.msg{display:flex;gap:9px}
.msg .bub{background:var(--card);border-radius:4px 15px 15px 15px;padding:10px 13px;max-width:262px}
.msg .who{font-size:11.5px;font-weight:600;margin-bottom:3px}
.msg .tx{font-size:14px;line-height:1.45}
.msg.me{justify-content:flex-end}
.msg.me .bub{background:var(--plum);color:#fff;border-radius:15px 4px 15px 15px}
.agent{border-left:2.5px solid var(--agent);background:var(--agent-t);border-radius:0 14px 14px 0;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.agent .hd{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--agent);font-family:var(--f-mono)}
.agent .tx{font-size:14px;line-height:1.5;color:var(--ink)}
.receipt{display:flex;align-items:center;gap:9px;font-size:12px;color:var(--ink2);padding:8px 12px;background:var(--sunk);border-radius:10px}
.receipt .undo{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--plum)}
.thread{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--card);border:1px dashed var(--line);border-radius:12px;font-size:12px;color:var(--ink2)}
.composer{flex:none;border-top:1px solid var(--line);background:var(--card);padding:11px 14px 20px;display:flex;gap:9px;align-items:center}
.composer .in{flex:1;background:var(--sunk);border-radius:99px;padding:11px 15px;color:var(--ink3);font-size:14px}
.composer .send{width:38px;height:38px;border-radius:99px;background:var(--plum);color:#fff;display:grid;place-items:center;font-size:16px;flex:none}
.locked-banner{background:var(--ink);color:var(--paper);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:5px}

/* ---------- decisions ---------- */
.dec{background:var(--card);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.dec .top{display:flex;align-items:center;gap:8px;padding:12px 14px 10px}
.dec .top .lbl{font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.dec .ttl{padding:0 14px 11px;font-family:var(--f-disp);font-size:16px;font-weight:600;letter-spacing:-.01em}
.dec .opts{display:flex;flex-direction:column}
.opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);position:relative}
.opt .bar{position:absolute;left:0;top:0;bottom:0;background:var(--plum-t);z-index:0}
.opt > *{position:relative;z-index:1}
.opt .nm{font-size:14px;font-weight:500}
.opt .rt{margin-left:auto;display:flex;align-items:center;gap:7px}
.opt.win .nm{font-weight:600}
.opt.dead .nm{color:var(--ink3);text-decoration:line-through}
.opt .box{width:19px;height:19px;border-radius:6px;border:1.5px solid var(--line);flex:none}
.opt .box.on{background:var(--plum);border-color:var(--plum)}
.dec .foot{display:flex;align-items:center;gap:8px;padding:11px 14px;border-top:1px solid var(--line);background:var(--sunk);font-size:11.5px;color:var(--ink2)}
.stamp{border:2px solid var(--signal-d);color:var(--signal-d);border-radius:8px;padding:5px 10px;font-family:var(--f-mono);
  font-size:11px;font-weight:600;transform:rotate(-3deg);display:inline-block;letter-spacing:.04em}

/* ---------- dates ---------- */
.cal{background:var(--card);border-radius:var(--r-lg);padding:14px}
.cal .hd{display:flex;align-items:center;margin-bottom:10px;font-size:13px;font-weight:600}
.cal .hd .nav{margin-left:auto;display:flex;gap:14px;color:var(--ink3)}
.cal .dow,.cal .days{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal .dow span{text-align:center;font-size:10px;color:var(--ink3);font-family:var(--f-mono);padding-bottom:5px}
.cal .days b{aspect-ratio:1;display:grid;place-items:center;font-size:12.5px;font-weight:400;border-radius:8px;color:var(--ink2)}
.cal .days b.free{background:var(--signal);color:#2F3708;font-weight:600}
.cal .days b.part{background:var(--warn-t);color:var(--warn);font-weight:500}
.cal .days b.blok{background:var(--stop-t);color:var(--stop);text-decoration:line-through}
.cal .days b.off{color:var(--ink3);opacity:.4}
.avail{display:flex;align-items:center;gap:9px}
.avail .nm{width:52px;font-size:12px;flex:none}
.avail .strip{flex:1;display:flex;gap:2px;height:16px}
.avail .strip i{flex:1;border-radius:3px;background:var(--sunk)}
.avail .strip i.f{background:var(--signal)}
.avail .strip i.p{background:var(--warn-t)}
.avail .strip i.b{background:var(--stop-t)}

/* ---------- destinations ---------- */
.dest{background:var(--card);border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--line)}
.dest .img{height:92px;background:linear-gradient(135deg,var(--plum),#8A4A82);display:flex;align-items:flex-end;padding:11px 14px}
.dest .img.b{background:linear-gradient(135deg,#1B7A6B,#3DA893)}
.dest .img.c{background:linear-gradient(135deg,#B06A1C,#D99A3F)}
.dest .img h4{font-family:var(--f-disp);font-size:19px;font-weight:700;color:#fff;letter-spacing:-.02em}
.dest .meta{display:flex;gap:14px;padding:11px 14px;border-bottom:1px solid var(--line)}
.dest .meta div{display:flex;flex-direction:column;gap:2px}
.dest .meta .k{font-size:9.5px;font-family:var(--f-mono);color:var(--ink3)}
.dest .meta .v{font-size:13px;font-weight:600}
.dest .why{padding:11px 14px;display:flex;flex-direction:column;gap:7px}
.dest .why .ln{display:flex;gap:8px;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.dest .why .ln b{flex:none;width:13px;font-weight:700}
.dest .why .ln.good b{color:var(--signal-d)}
.dest .why .ln.bad b{color:var(--stop)}

/* ---------- lists ---------- */
.lrow{display:flex;align-items:center;gap:11px;padding:12px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .gr{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.lrow .nm{font-size:14px;font-weight:500}
.lrow .sub{font-size:11.5px;color:var(--ink3)}
.fact{display:flex;align-items:flex-start;gap:9px;padding:11px 0;border-bottom:1px solid var(--line)}
.fact .dot{width:7px;height:7px;border-radius:99px;margin-top:6px;flex:none;background:var(--agent)}
.fact .dot.low{background:var(--warn)}
.fact .dot.hard{background:var(--stop)}
.fact .dot.said{background:var(--ink3)}
.tick{width:21px;height:21px;border-radius:7px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;font-size:12px;color:transparent}
.tick.on{background:var(--signal);border-color:var(--signal);color:#2F3708;font-weight:700}
.tl{display:flex;gap:12px}
.tl .time{width:46px;flex:none;font-family:var(--f-mono);font-size:10.5px;color:var(--ink3);padding-top:14px}
.tl .spine{width:1px;background:var(--line);position:relative;flex:none}
.tl .spine::before{content:"";position:absolute;top:16px;left:-3.5px;width:8px;height:8px;border-radius:99px;background:var(--plum)}
.ring{width:44px;height:44px;border-radius:99px;flex:none;display:grid;place-items:center;font-size:11px;font-weight:700;
  background:conic-gradient(var(--signal) 0 62%,var(--sunk) 62% 100%)}
.ring span{width:34px;height:34px;border-radius:99px;background:var(--card);display:grid;place-items:center}
.bar{height:9px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.bar i{display:block;background:var(--plum)}
.bar i.over{background:var(--stop)}
.mail{background:var(--card);border-radius:var(--r-lg);padding:16px;display:flex;flex-direction:column;gap:11px;border:1px solid var(--line)}
</style>

<aside>
  <h1>Caravan</h1>
  <p class="sub">Agentic group-trip planner. v1 screens, F1&ndash;F16. Mobile 390&times;844.</p>
  <nav id="nav"></nav>
</aside>

<main>
  <header>
    <h2>The whole v1, on one page</h2>
    <p>Forty screens across seven flows. Everything a friend group touches between &ldquo;let&rsquo;s go somewhere&rdquo; and a locked destination &mdash; plus the surfaces the agents act on. Read left to right within each flow.</p>
  </header>
  <div id="app"></div>
</main>

<script>
const M = {amit:["AP","var(--m1)"],rhea:["R","var(--m2)"],karan:["K","var(--m3)"],nidhi:["N","var(--m4)"],farhan:["F","var(--m5)"],ishaan:["I","var(--m6)"]};
const av=(k,c)=>`<div class="av ${c||''}" style="background:${M[k][1]}">${M[k][0]}</div>`;
const avs=(ks)=>`<div class="stackav">${ks.map(k=>av(k,'sm')).join('')}</div>`;
const sb=()=>`<div class="sb"><span class="t">9:41</span><span class="r">5G 84%</span></div>`;
const bar=(t,{back=true,right=''}={})=>`<div class="appbar">${back?'<span class="bk">&lsaquo;</span>':''}<h3>${t}</h3>${right?`<span class="rt">${right}</span>`:''}</div>`;
const tabs=(on,b={})=>`<div class="tabbar">
  ${['Room','Plan','You'].map(n=>`<div class="${on===n?'on':''}"><span class="ic"></span>${n}${b[n]?`<span class="bdg">${b[n]}</span>`:''}</div>`).join('')}
</div>`;
const dots=(i,n)=>`<div class="dots">${Array.from({length:n},(_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;
const chips=(a)=>`<div class="wrap">${a.map(([l,s])=>`<span class="chip ${s||''}">${l}</span>`).join('')}</div>`;
const fld=(l,v,ph)=>`<div class="field"><label>${l}</label><div class="input ${ph?'ph':''}">${v}</div></div>`;

const SCREENS=[];
const S=(flow,id,name,note,inner)=>SCREENS.push({flow,id,name,note,inner});
const FLOWS={};
const F=(key,title,desc)=>FLOWS[key]={title,desc};
</script>
<script>
F('A','Setting up a trip','Only the person starting the trip signs in. Everything they set here is a starting point the group can argue with later, not a decision.');

S('A','A1','Landing','First hit on the root URL',`
${sb()}
<div class="body" style="padding-top:26px">
  <div class="push"></div>
  <div class="row"><div class="av lg" style="background:var(--plum);border-radius:15px">C</div><span class="h1">Caravan</span></div>
  <div class="d1">Somebody always ends up running the trip.</div>
  <p class="p">Share one link. Everyone drops their dates and budget from their own phone. An agent does the chasing, the date maths and the deciding.</p>
  <div class="push"></div>
  <button class="btn btn-p">Start a trip</button>
  <button class="btn btn-s">I have an invite code</button>
</div>`);

S('A','A2','Admin sign-in','F1 &middot; Google only',`
${sb()}${bar('',{back:true})}
<div class="body">
  <div class="push"></div>
  <div class="h1">Sign in to start a trip</div>
  <p class="p">Only you need an account. Everyone you invite joins with a name and an email, nothing else.</p>
  <div class="push"></div>
  <button class="btn btn-s"><span class="av sm" style="background:var(--sunk);color:var(--ink2)">G</span>Continue with Google</button>
  <p class="xs" style="text-align:center">Joining someone else&rsquo;s trip? Just open the link they sent you.</p>
</div>`);

S('A','A3','Your trips','F1 &middot; one person, many trips',`
${sb()}

<script>
const nav=document.getElementById('nav'), app=document.getElementById('app');
for(const key of Object.keys(FLOWS)){
  const f=FLOWS[key], list=SCREENS.filter(s=>s.flow===key);

  const h=document.createElement('h3');
  h.className='flowhead'; h.id='f'+key; h.textContent=f.title;
  const d=document.createElement('p'); d.className='flowdesc'; d.innerHTML=f.desc;
  const g=document.createElement('div'); g.className='grid';

  for(const s of list){
    const slot=document.createElement('div');
    slot.className='slot'; slot.id=s.id;
    slot.innerHTML=`<div class="cap"><i>${s.id}</i><b>${s.name}</b></div>
      <div class="phone">${s.inner}</div>
      <p style="color:#75777F;font-size:11.5px;margin-top:9px;line-height:1.5">${s.note}</p>`;
    g.appendChild(slot);
  }
  app.append(h,d,g);

  const nf=document.createElement('div'); nf.className='flow';
  nf.innerHTML=`<p>${key} &nbsp;${f.title.toUpperCase()}</p>`+
    list.map(s=>`<a href="#${s.id}">${s.id} &nbsp;${s.name}</a>`).join('');
  nav.appendChild(nf);
}
</script>
